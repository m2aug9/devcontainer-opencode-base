[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "<project name>"
version = "0.1.0"
description = "<project description>"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
